name: Deploy com versão automática

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar versão do Service Worker
        run: |
          # Gera versão baseada na data/hora do commit
          VERSION="v$(date +'%Y%m%d%H%M%S')"
          echo "Nova versão: $VERSION"
          # Substitui o VERSION no sw.js
          sed -i "s/const VERSION = \".*\"/const VERSION = \"$VERSION\"/" sw.js

      - name: Commit da versão atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git diff --staged --quiet || git commit -m "chore: bump SW version [skip ci]"
          git push
